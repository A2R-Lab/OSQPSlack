[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "osqpslack"
version = "0.1.0"
description = "Code to reproduce the results of the OSQPSlack paper"
license = "MIT"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["osqpslack"]

[tool.ruff]
line-length = 120
